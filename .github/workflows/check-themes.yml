name: Check themes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  merge_conflict:
    name: Find merge conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          show-progress: 'false'
      - name: Merge Conflict finder
        uses: olivernybroe/action-conflict-finder@1a949ebd954a9eaee58802229ea5f9c69fb93a50 # v4.1

  parse:
    name: Parse themes with JavaFX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # The audit reads the pre-port themes out of the repository history.
          fetch-depth: 0
      - name: Generate JBang cache key
        id: cache-key
        shell: bash
        run: echo "cache_key=jbang-checkthemes-$(date +%Y-%m)" >> $GITHUB_OUTPUT
      - name: Cache JBang
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.jbang
          key: ${{ steps.cache-key.outputs.cache_key }}
          restore-keys:
            jbang-checkthemes-
      - name: Resolve //DEPS into the cached directory
        # JBang resolves script dependencies into ~/.m2, which is not cached here.
        run: echo "JBANG_REPO=$HOME/.jbang/repository" >> "$GITHUB_ENV"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: 'corretto'
          java-version: '25'
      - name: Setup JBang
        # Pinned to a commit for deterministic CI; comment tracks the tag.
        uses: jbangdev/setup-jbang@2b1b465a7b75f4222b81426f23a01e013aa7b95c # v0.1.1
      - name: Parse themes
        run: jbang .github/CheckThemes.java themes
      - name: Audit against the pre-port themes
        run: python3 .github/audit-migration.py

  markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Check table alignment
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'
